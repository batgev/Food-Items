<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provisions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="app">
        <div class="header">
            <h1>Food Items For GD</h1>
            <span id="date">7/10/2026</span>
        </div>
        <div class="input-area">
            <input type="text" class="add-input" id="add-input">
            <button class="add-btn" id="add-btn">Add Item</button>
        </div>
        <div class="filters">
            <span id="filters-all" class="active">All</span>
            <span id="purchased" class="inactive">Purchased</span>
            <span id="not-purchased" class="inactive">Not Purchased</span>
        </div>
       <div class="list">
        <ul class="list-items" id="list-items"></ul>
       <div id="no-items">
         <img src="imgs/logo.png" alt="empty list">
         <p>Nothing yet, add an item</p>
       </div>
       </div>
        <footer class="footer">
            <span class="items-left">Items Left: <span id="items-left">0</span></span>
            <span class="developed-by">Developers: Gevaise & Doreen</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
